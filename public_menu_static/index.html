<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cardápio — Recanto da Barra</title>
<meta name="theme-color" content="#6b1621">
<style>
  :root{
    --bg:#f5f2ef;
    --card:#ffffff;
    --primary:#8a1f2b;
    --primary2:#c0432f;
    --primary-soft:#fbe9ea;
    --text:#211c1a;
    --text-muted:#8a8380;
    --border:#eee7e2;
    --radius:20px;
    --shadow:0 4px 16px rgba(40,20,10,.08);
  }
  *{box-sizing:border-box;min-width:0;}
  html,body{margin:0;padding:0;width:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:120px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;width:100%;}

  /* ── Hero ─────────────────────────────────────────────────────────── */
  .hero{
    position:relative;
    padding:34px 20px 46px;
    text-align:center;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);
    color:#fff;
    overflow:hidden;
  }
  .hero::before,.hero::after{
    content:'';position:absolute;border-radius:50%;
    background:rgba(255,255,255,.08);
  }
  .hero::before{width:220px;height:220px;top:-110px;left:-60px;}
  .hero::after{width:160px;height:160px;bottom:-90px;right:-40px;}
  .hero-inner{position:relative;z-index:1;}
  .hero img{
    width:72px;height:72px;border-radius:50%;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.85);
    margin-bottom:12px;
  }
  .hero h1{
    margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;
  }
  .hero p{
    margin:5px 0 0;font-size:0.8rem;color:rgba(255,255,255,.85);
    text-transform:uppercase;letter-spacing:1.8px;font-weight:700;
  }

  /* ── Category tabs (floating sheet, sticky) ─────────────────────────── */
  .cat-tabs-wrap{margin-top:-26px;position:relative;z-index:5;padding:0 16px;}
  .cat-tabs{
    position:sticky;top:10px;
    background:#fff;border-radius:16px;
    box-shadow:0 6px 20px rgba(40,20,10,.14);
    padding:10px 8px;
  }
  .cat-tabs-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:0 4px;
    scrollbar-width:none;
  }
  .cat-tabs-scroll::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex:0 0 auto;
    padding:9px 15px;border-radius:999px;
    background:var(--bg);
    font-size:0.85rem;font-weight:700;color:var(--text-muted);
    white-space:nowrap;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,color .15s;
  }
  .cat-tab.active{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);
    color:#fff;
  }

  /* ── Categories / items ───────────────────────────────────────────── */
  main{padding:22px 16px 0;}
  .cat{padding-top:14px;scroll-margin-top:78px;}
  .cat:first-child{padding-top:0;}
  .cat h2{
    font-size:1.2rem;font-weight:800;letter-spacing:-0.01em;
    margin:0 0 2px;color:var(--text);
    display:flex;align-items:center;gap:8px;
  }
  .cat-desc{font-size:0.82rem;color:var(--text-muted);margin:0 0 12px;}
  .cat h2 + .item-list, .cat h2 + .cat-desc + .item-list{margin-top:14px;}

  .item-list{display:flex;flex-direction:column;gap:10px;}
  .item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px;
    display:flex;gap:12px;align-items:flex-start;
    transition:box-shadow .15s;
  }
  .item.has-qty{box-shadow:0 4px 16px rgba(138,31,43,.18);border-color:var(--primary-soft);}
  .item-icon{
    flex-shrink:0;width:44px;height:44px;border-radius:13px;
    background:linear-gradient(135deg,var(--primary-soft),#fff);
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  }
  .item-body{flex:1;}
  .item-top{display:flex;align-items:flex-start;gap:8px;}
  .item-info{flex:1;}
  .item-name{font-weight:700;font-size:0.96rem;color:var(--text);line-height:1.3;}
  .item-desc{font-size:0.78rem;color:var(--text-muted);margin-top:2px;line-height:1.4;}
  .item-price{
    font-weight:800;color:var(--primary);font-size:0.95rem;
    white-space:nowrap;flex-shrink:0;
  }
  .qty{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;}
  .qty-control{
    display:flex;align-items:center;
    background:var(--bg);border-radius:999px;overflow:hidden;
  }
  .qty-control button{
    width:32px;height:32px;border:none;background:transparent;
    color:var(--primary);font-size:1.15rem;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .qty-control button:active{background:var(--primary-soft);}
  .qty-control span{min-width:20px;text-align:center;font-weight:800;font-size:0.9rem;}

  /* ── Meio a meio (pizza) ──────────────────────────────────────────── */
  .combo-card{
    background:linear-gradient(135deg,#fff8f5,#fff);
    border:1.5px dashed var(--primary2);
    border-radius:var(--radius);
    padding:14px;margin-bottom:12px;
  }
  .combo-title{
    font-weight:800;font-size:0.95rem;display:flex;align-items:center;gap:6px;margin-bottom:10px;
  }
  .combo-selects{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .combo-selects select{
    flex:1;min-width:0;padding:10px 8px;border-radius:12px;
    border:1px solid var(--border);background:#fff;font-size:0.82rem;
    color:var(--text);font-family:inherit;
  }
  .combo-plus{font-weight:800;color:var(--primary2);flex-shrink:0;}
  .combo-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .combo-price{font-weight:800;color:var(--primary);font-size:0.95rem;}
  .combo-hint{font-size:0.68rem;color:var(--text-muted);margin-top:2px;}
  .combo-add{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;border:none;border-radius:999px;padding:10px 16px;
    font-weight:700;font-size:0.82rem;cursor:pointer;flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .combo-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;}

  /* ── Info footer ──────────────────────────────────────────────────── */
  .info-box{
    margin:28px 0 20px;padding:16px 18px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--border);
    font-size:0.8rem;text-align:center;line-height:1.8;color:var(--text-muted);
  }
  .info-box b{color:var(--text);}
  .info-box .warn{display:block;margin-top:6px;font-size:0.7rem;color:#b0a8a3;}

  /* ── Cart bar ─────────────────────────────────────────────────────── */
  .cartbar{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 -8px 24px rgba(138,31,43,.35);
    border-radius:20px 20px 0 0;
  }
  .cartbar .total{font-size:0.75rem;color:rgba(255,255,255,.8);min-width:0;flex-shrink:1;}
  .cartbar .total b{font-size:1.1rem;display:block;color:#fff;white-space:nowrap;}
  .cartbar button{
    background:#fff;color:var(--primary);border:none;border-radius:999px;
    padding:12px 18px;font-weight:800;font-size:0.85rem;cursor:pointer;
    display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .cartbar button:disabled{background:rgba(255,255,255,.4);color:rgba(138,31,43,.5);cursor:not-allowed;}

  .state-msg{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:0.9rem;}
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="state-msg">Carregando cardápio…</div>
  </div>

  <div class="cartbar" id="cartbar" style="display:none;">
    <div class="total">
      <span id="cart-count">0 itens</span>
      <b id="cart-total">R$ 0,00</b>
    </div>
    <button id="send-btn" disabled>Enviar pedido →</button>
  </div>

<script>
(function () {
  var slug = window.location.pathname.split('/').filter(Boolean).pop() || 'matriz';
  var app = document.getElementById('app');
  var cart = {};       // key -> {name, price, qty, category}
  var registry = {};   // key -> {name, price, category}  (pra achar dados de qualquer linha, item normal ou combo)

  function money(v) {
    return 'R$ ' + v.toFixed(2).replace('.', ',');
  }

  function categoryEmoji(name) {
    var n = name.toLowerCase();
    if (n.indexOf('pizza') > -1) return '🍕';
    if (n.indexOf('cerveja') > -1) return '🍺';
    if (n.indexOf('destilado') > -1 || n.indexOf('drink') > -1) return '🍸';
    if (n.indexOf('petisco') > -1 || n.indexOf('por') > -1) return '🍟';
    if (n.indexOf('refriger') > -1 || n.indexOf('suco') > -1 || n.indexOf('gua') > -1) return '🥤';
    return '🍽️';
  }

  function isPizzaCategory(name) {
    return name.toLowerCase().indexOf('pizza') > -1;
  }

  function renderCartBar() {
    var count = 0, total = 0;
    Object.values(cart).forEach(function (i) {
      count += i.qty;
      total += i.qty * i.price;
    });
    document.getElementById('cart-count').textContent =
      count + (count === 1 ? ' item' : ' itens');
    document.getElementById('cart-total').textContent = money(total);
    document.getElementById('send-btn').disabled = count === 0;
    document.getElementById('cartbar').style.display = 'flex';
  }

  function setQty(key, delta) {
    var info = registry[key];
    if (!info) return;
    var cur = cart[key] ? cart[key].qty : 0;
    var next = Math.max(0, cur + delta);
    if (next === 0) {
      delete cart[key];
    } else {
      cart[key] = { name: info.name, price: info.price, qty: next, category: info.category };
    }
    return next;
  }

  // Renderiza (ou atualiza) uma linha de item/combo com stepper, no padrão visual comum
  function itemRowHtml(key, icon, name, desc, price) {
    var qty = cart[key] ? cart[key].qty : 0;
    var h = '<div class="item' + (qty > 0 ? ' has-qty' : '') + '" id="row-' + key + '" data-key="' + key + '">';
    h += '<div class="item-icon">' + icon + '</div>';
    h += '<div class="item-body">';
    h += '<div class="item-top"><div class="item-info"><div class="item-name">' + name + '</div>';
    if (desc) h += '<div class="item-desc">' + desc + '</div>';
    h += '</div><div class="item-price">' + money(price) + '</div></div>';
    h += '<div class="qty"><div class="qty-control">';
    h += '<button data-qtybtn data-key="' + key + '" data-delta="-1" aria-label="Diminuir">−</button>';
    h += '<span id="qty-' + key + '">' + qty + '</span>';
    h += '<button data-qtybtn data-key="' + key + '" data-delta="1" aria-label="Aumentar">+</button>';
    h += '</div></div>';
    h += '</div></div>';
    return h;
  }

  function buildWhatsAppMessage(data) {
    var lines = ['Olá! Vim pelo cardápio digital e queria fazer esse pedido:', ''];
    var total = 0;
    var byCategory = {};
    Object.values(cart).forEach(function (i) {
      byCategory[i.category] = byCategory[i.category] || [];
      byCategory[i.category].push(i);
    });
    Object.keys(byCategory).forEach(function (cat) {
      lines.push('*' + cat + '*');
      byCategory[cat].forEach(function (i) {
        var lineTotal = i.qty * i.price;
        total += lineTotal;
        lines.push('• ' + i.qty + 'x ' + i.name + ' — ' + money(lineTotal));
      });
      lines.push('');
    });
    lines.push('Subtotal: ' + money(total));
    if (data.service_fee_percent > 0) {
      lines.push('(+ ' + data.service_fee_percent.toString().replace('.0', '') +
        '% de taxa de serviço, não incluída acima)');
    }
    return lines.join('\n');
  }

  function render(data) {
    document.title = 'Cardápio — ' + data.establishment_name;
    var html = '';

    html += '<header class="hero"><div class="hero-inner">';
    html += '<img src="/static/logo.png" alt="Logo">';
    html += '<h1>' + data.establishment_name + '</h1>';
    html += '<p>Bar &amp; Restaurante</p>';
    html += '</div></header>';

    html += '<div class="cat-tabs-wrap"><nav class="cat-tabs"><div class="cat-tabs-scroll" id="cat-tabs-scroll">';
    data.categories.forEach(function (cat, ci) {
      html += '<div class="cat-tab" data-target="cat-' + ci + '">' + categoryEmoji(cat.name) + ' ' + cat.name + '</div>';
    });
    html += '</div></nav></div>';

    html += '<main>';
    data.categories.forEach(function (cat, ci) {
      var emoji = categoryEmoji(cat.name);
      html += '<section class="cat" id="cat-' + ci + '">';
      html += '<h2>' + emoji + ' ' + cat.name + '</h2>';
      if (cat.description) html += '<p class="cat-desc">' + cat.description + '</p>';

      // Registrar itens normais + card de meio a meio pra categorias de pizza
      cat.items.forEach(function (item, ii) {
        registry['item-' + ci + '-' + ii] = { name: item.name, price: item.price, category: cat.name };
      });

      if (isPizzaCategory(cat.name) && cat.items.length > 1) {
        html += '<div class="combo-card" id="combo-' + ci + '">';
        html += '<div class="combo-title">🍕 Monte a sua meio a meio</div>';
        html += '<div class="combo-selects">';
        html += '<select class="combo-select" data-ci="' + ci + '" data-half="a">';
        cat.items.forEach(function (item, ii) { html += '<option value="' + ii + '"' + (ii === 0 ? ' selected' : '') + '>' + item.name + '</option>'; });
        html += '</select><span class="combo-plus">+</span>';
        html += '<select class="combo-select" data-ci="' + ci + '" data-half="b">';
        cat.items.forEach(function (item, ii) { html += '<option value="' + ii + '"' + (ii === 1 ? ' selected' : '') + '>' + item.name + '</option>'; });
        html += '</select>';
        html += '</div>';
        html += '<div class="combo-footer">';
        html += '<div><div class="combo-price" id="combo-price-' + ci + '">' + money(Math.max(cat.items[0].price, cat.items[1] ? cat.items[1].price : cat.items[0].price)) + '</div>';
        html += '<div class="combo-hint">Cobra-se o valor da metade mais cara</div></div>';
        html += '<button class="combo-add" data-combo-add="' + ci + '">Adicionar</button>';
        html += '</div>';
        html += '<div class="combo-list" id="combo-list-' + ci + '"></div>';
        html += '</div>';
      }

      html += '<div class="item-list" id="items-' + ci + '">';
      cat.items.forEach(function (item, ii) {
        var key = 'item-' + ci + '-' + ii;
        html += itemRowHtml(key, emoji, item.name, item.description, item.price);
      });
      html += '</div>';
      html += '</section>';
    });
    html += '</main>';

    html += '<div class="info-box">';
    if (data.service_fee_percent > 0) {
      html += '<b>Taxa de serviço de ' + data.service_fee_percent + '% não inclusa nos preços acima.</b><br>';
    }
    html += 'Pedido enviado por WhatsApp — a confirmação e o prazo são combinados por lá.';
    html += '<span class="warn">Venda proibida para menores de 18 anos.</span>';
    html += '</div>';

    app.innerHTML = html;

    // ── Delegação de eventos: cobre linhas normais E linhas de combo criadas depois ──
    app.addEventListener('click', function (e) {
      var qbtn = e.target.closest('[data-qtybtn]');
      if (qbtn) {
        var key = qbtn.getAttribute('data-key');
        var delta = parseInt(qbtn.getAttribute('data-delta'), 10);
        var next = setQty(key, delta);
        var span = document.getElementById('qty-' + key);
        if (span) span.textContent = next;
        var row = document.getElementById('row-' + key);
        if (row) row.classList.toggle('has-qty', next > 0);
        renderCartBar();
        return;
      }

      var addBtn = e.target.closest('[data-combo-add]');
      if (addBtn) {
        var ci = addBtn.getAttribute('data-combo-add');
        var selA = app.querySelector('.combo-select[data-ci="' + ci + '"][data-half="a"]');
        var selB = app.querySelector('.combo-select[data-ci="' + ci + '"][data-half="b"]');
        var ia = parseInt(selA.value, 10), ib = parseInt(selB.value, 10);
        var itemA = data.categories[ci].items[ia];
        var itemB = data.categories[ci].items[ib];
        var lo = Math.min(ia, ib), hi = Math.max(ia, ib);
        var comboKey = 'combo-' + ci + '-' + lo + '-' + hi;
        var price = Math.max(itemA.price, itemB.price);
        var name = (ia === ib)
          ? itemA.name
          : 'Meio a meio: ' + data.categories[ci].items[lo].name + ' / ' + data.categories[ci].items[hi].name;
        registry[comboKey] = { name: name, price: price, category: data.categories[ci].name };

        var list = document.getElementById('combo-list-' + ci);
        if (!document.getElementById('row-' + comboKey)) {
          list.insertAdjacentHTML('beforeend', itemRowHtml(comboKey, '🍕', name, null, price));
        }
        var next2 = setQty(comboKey, 1);
        var span2 = document.getElementById('qty-' + comboKey);
        if (span2) span2.textContent = next2;
        var row2 = document.getElementById('row-' + comboKey);
        if (row2) row2.classList.add('has-qty');
        renderCartBar();
        return;
      }

      var tab = e.target.closest('.cat-tab');
      if (tab) {
        var target = document.getElementById(tab.getAttribute('data-target'));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    // Meio a meio: preço ao vivo conforme troca a seleção
    app.querySelectorAll('.combo-select').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var ci = sel.getAttribute('data-ci');
        var selA = app.querySelector('.combo-select[data-ci="' + ci + '"][data-half="a"]');
        var selB = app.querySelector('.combo-select[data-ci="' + ci + '"][data-half="b"]');
        var itemA = data.categories[ci].items[parseInt(selA.value, 10)];
        var itemB = data.categories[ci].items[parseInt(selB.value, 10)];
        var priceEl = document.getElementById('combo-price-' + ci);
        if (priceEl) priceEl.textContent = money(Math.max(itemA.price, itemB.price));
      });
    });

    // Abas de categoria: destaca a atual conforme rola a página
    var tabs = Array.prototype.slice.call(app.querySelectorAll('.cat-tab'));
    var sections = Array.prototype.slice.call(app.querySelectorAll('.cat'));
    if ('IntersectionObserver' in window && sections.length) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var idx = sections.indexOf(entry.target);
            tabs.forEach(function (t) { t.classList.remove('active'); });
            if (tabs[idx]) tabs[idx].classList.add('active');
          }
        });
      }, { rootMargin: '-86px 0px -60% 0px', threshold: 0 });
      sections.forEach(function (s) { observer.observe(s); });
    }
    if (tabs[0]) tabs[0].classList.add('active');

    renderCartBar();

    document.getElementById('send-btn').addEventListener('click', function () {
      if (!data.whatsapp) {
        alert('Número de WhatsApp não configurado. Peça pro estabelecimento configurar PUBLIC_MENU_WHATSAPP.');
        return;
      }
      var msg = buildWhatsAppMessage(data);
      var url = 'https://wa.me/' + data.whatsapp + '?text=' + encodeURIComponent(msg);
      window.open(url, '_blank');
    });
  }

  fetch('/api/cardapio/' + encodeURIComponent(slug))
    .then(function (r) {
      if (!r.ok) throw new Error('not-ok');
      return r.json();
    })
    .then(render)
    .catch(function () {
      app.innerHTML = '<div class="state-msg">Não conseguimos carregar o cardápio agora. Tente novamente em instantes.</div>';
    });
})();
</script>
</body>
</html>
